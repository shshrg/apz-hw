apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    io.kompose.service: facade-service
  name: facade-service
spec:
  serviceName: "facade-service"
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: facade-service
  template:
    metadata:
      labels:
        io.kompose.service: facade-service
    spec:
      serviceAccountName: facade-service
      containers:
          - image: facade-service
            name: facade-service
            imagePullPolicy: IfNotPresent
            ports:
              - containerPort: 8080
                protocol: TCP
            resources:
              limits:
                cpu: 500m
                memory: "536870912"
            env:
              - name: HAZELCAST_URL
                valueFrom:
                  configMapKeyRef:
                    name: hazelcast-config
                    key: HAZELCAST_URL
      restartPolicy: Always
