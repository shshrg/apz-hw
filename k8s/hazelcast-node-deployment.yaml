apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: hazelcast-node
  name: hazelcast-node
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: hazelcast-node
  template:
    metadata:
      labels:
        io.kompose.service: hazelcast-node
    spec:
      containers:
        - image: hazelcast/hazelcast:5.3
          livenessProbe:
            exec:
              command:
                - curl -f http://localhost:5701/hazelcast/health/ready || exit 1
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          name: hazelcast-node
          ports:
            - containerPort: 5701
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: "2147483648"
      restartPolicy: Always
